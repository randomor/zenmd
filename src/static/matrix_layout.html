<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  {{#ogImage}}<meta property="og:image" content="{{{ogImage}}}">{{/ogImage}}
  {{#ogUrl}}<meta property="og:url" content="{{{ogUrl}}}">{{/ogUrl}}
  <link rel="icon" href="{{{favicon}}}">
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
  <title>{{title}}</title>
  <style>
    /* Matrix-inspired green-on-black theme */
    :root {
      --accent: #0f0;
      --code: #0f0;
      --text-light: #28f728;
      --preformatted: #03e303;
      --border: #013f01;
      --content-width: 80rem;
      --sidebar-width: 300px;
      --gap: 4rem;
    }

    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.8;
      overflow-x: clip; /* Prevent horizontal scrollbars from full-bleed images */
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Courier New', Courier, monospace;
    }

    a {
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }

    aside,
    details,
    pre,
    progress {
      background-color: #111111;
    }

    footer p a,
    footer p {
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }

    /* Full-bleed image support - allows images to span full viewport width */
    .bleed {
      display: block;
      width: 100vw;
      max-width: 100vw;
      margin-left: 50%;
      transform: translateX(-50%);
    }

    /* Main Grid Layout */
    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      grid-column: 1 / -1;
    }

    /* Article formatting override to fit grid */
    main.article {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      min-width: 0;
      overflow-wrap: break-word;
      word-wrap: break-word;
    }

    /* Desktop View with Sidebar */
    @media (min-width: 1100px) {
      .main-grid.has-sidebar {
        grid-template-columns: minmax(65ch, 80ch) var(--sidebar-width);
        gap: var(--gap);
        justify-content: center;
        max-width: calc(80ch + var(--sidebar-width) + var(--gap));
      }

      .main-grid.has-sidebar .toc-sidebar {
        display: block !important;
      }

      .main-grid.has-sidebar main.article {
        max-width: 80ch;
      }

      .hide-on-desktop {
        display: none !important;
      }
    }

    /* TOC Sidebar Styles */
    .toc-sidebar {
      display: none;
      width: 100% !important;
      float: none !important;
      margin: 0 !important;
      background: none !important;
      border: none !important;
      border-left: 1px solid var(--border) !important;
      position: sticky;
      top: 4rem;
      align-self: start;
      max-height: calc(100vh - 6rem);
      overflow-y: auto;
      padding-left: 1.5rem;
      font-family: var(--mono-font);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .toc-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .toc-title svg {
      width: 1.1em;
      height: 1.1em;
      opacity: 0.8;
    }

    .toc-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-item {
      margin: 0;
      padding: 0;
    }

    .toc-link,
    .toc-link:visited {
      display: block;
      padding: 0.5rem 0 0.5rem 1rem;
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.9rem;
      border-left: 2px solid transparent;
      margin-left: -1.6rem;
      padding-left: 1.5rem;
      transition: color 0.2s ease, border-color 0.2s ease;
      line-height: 1.5;
      text-shadow: 0 0 5px #0f0;
    }

    .toc-link:hover {
      color: var(--accent);
    }

    .toc-link.active {
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 500;
    }

    .toc-sub-menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-sub-menu .toc-link,
    .toc-sub-menu .toc-link:visited {
      color: var(--text-light);
    }

    .toc-sub-menu .toc-link {
      font-size: 0.85rem;
      padding-top: 0.25rem;
      padding-bottom: 0.25rem;
      padding-left: 2.5rem;
      margin-left: -1.6rem;
      border-left: 2px solid transparent;
    }

    .toc-sub-menu .toc-link.active {
      border-left-color: var(--accent);
      color: var(--accent);
    }

    /* Lightbox Styles */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      cursor: zoom-out;
      backdrop-filter: blur(5px);
    }

    .lightbox-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-image {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      cursor: default;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .lightbox-overlay.active .lightbox-image {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 3rem;
      color: #fff;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
      line-height: 0.8;
      font-family: var(--mono-font);
      font-weight: 300;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    /* Image/Twitter centering */
    main.article img {
      cursor: zoom-in;
      transition: opacity 0.2s;
      max-height: 50vh;
      width: auto;
      display: block;
      margin: 1.5rem auto;
    }

    main.article iframe {
      display: block;
      margin: 1.5rem auto;
      max-width: 100%;
    }

    main.article .twitter-tweet {
      margin-left: auto !important;
      margin-right: auto !important;
    }

    main.article img:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="main-grid" id="main-grid">
    <main class="article">
      {{{content}}}
    </main>

    <aside class="toc-sidebar" id="toc-sidebar">
      <div class="toc-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="3" y2="18"></line>
        </svg>
        On this page
      </div>
      <nav id="toc-nav"></nav>
    </aside>
  </div>

  <footer>
    <p>Powered by <a href="https://www.npmjs.com/package/zenmd">ZenMD</a></p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const article = document.querySelector('main.article');
      const tocNav = document.getElementById('toc-nav');
      const mainGrid = document.getElementById('main-grid');

      if (!article || !tocNav || !mainGrid) return;

      const headers = Array.from(article.querySelectorAll('h2, h3'));
      if (headers.length === 0) return;

      const isContentsHeader = (header) => {
        const text = (header.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
        const id = (header.id || '').toLowerCase();
        return text === 'contents' ||
          text === 'table of contents' ||
          id === 'contents' ||
          id === 'table-of-contents';
      };

      const contentsHeader = headers.find(isContentsHeader);
      if (!contentsHeader) return;

      const contentHeaders = headers.filter((header) => header !== contentsHeader);
      if (contentHeaders.length === 0) return;

      mainGrid.classList.add('has-sidebar');
      contentsHeader.classList.add('hide-on-desktop');

      const nextEl = contentsHeader.nextElementSibling;
      if (nextEl && (nextEl.tagName === 'UL' || nextEl.tagName === 'OL')) {
        nextEl.classList.add('hide-on-desktop');
      }

      const ul = document.createElement('ul');
      ul.className = 'toc-menu';

      let currentH2Li = null;
      let currentSubMenu = null;

      contentHeaders.forEach((header) => {
        if (!header.id) {
          header.id = header.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        }

        const li = document.createElement('li');
        li.className = 'toc-item';

        const a = document.createElement('a');
        a.href = '#' + header.id;
        a.innerText = header.textContent.trim();
        a.className = 'toc-link';

        li.appendChild(a);

        if (header.tagName === 'H2') {
          ul.appendChild(li);
          currentH2Li = li;
          currentSubMenu = null;
        } else if (header.tagName === 'H3' && currentH2Li) {
          if (!currentSubMenu) {
            currentSubMenu = document.createElement('ul');
            currentSubMenu.className = 'toc-sub-menu';
            currentH2Li.appendChild(currentSubMenu);
          }
          currentSubMenu.appendChild(li);
        } else {
          ul.appendChild(li);
        }
      });

      tocNav.appendChild(ul);

      const onScroll = () => {
        let current = '';
        const scrollPos = window.scrollY;

        for (const section of contentHeaders) {
          const sectionTop = section.offsetTop;
          if (scrollPos >= sectionTop - 150) {
            current = section.getAttribute('id');
          }
        }

        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50) {
          current = contentHeaders[contentHeaders.length - 1].getAttribute('id');
        }

        document.querySelectorAll('.toc-sidebar .toc-link').forEach((link) => {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + current) {
            link.classList.add('active');
          }
        });
      };

      window.addEventListener('scroll', onScroll);
      onScroll();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const lightboxOverlay = document.createElement('div');
      lightboxOverlay.className = 'lightbox-overlay';
      lightboxOverlay.innerHTML = `
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-image" src="" alt="Lightbox Image">
      `;
      document.body.appendChild(lightboxOverlay);

      const lightboxImage = lightboxOverlay.querySelector('.lightbox-image');
      const lightboxClose = lightboxOverlay.querySelector('.lightbox-close');

      const openLightbox = (src) => {
        lightboxImage.src = src;
        lightboxOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      };

      const closeLightbox = () => {
        lightboxOverlay.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => {
          lightboxImage.src = '';
        }, 300);
      };

      document.querySelectorAll('main.article img').forEach((img) => {
        img.addEventListener('click', (event) => {
          event.stopPropagation();
          openLightbox(img.src);
        });
      });

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxOverlay.addEventListener('click', (event) => {
        if (event.target === lightboxOverlay) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && lightboxOverlay.classList.contains('active')) {
          closeLightbox();
        }
      });
    });
  </script>
</body>

</html>
