<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  {{#ogImage}}<meta property="og:image" content="{{{ogImage}}}">{{/ogImage}}
  {{#ogUrl}}<meta property="og:url" content="{{{ogUrl}}}">{{/ogUrl}}
  <link rel="icon" href="{{{favicon}}}">
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
  <link rel="stylesheet" href="{{{assetsBase}}}/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <title>{{title}}</title>
  <style>
    /* Cyberpunk-inspired neon theme on dark background */
    :root {
      --accent: #00ff9f;
      --code: #00b8ff;
      --text: #e0e0e0;
      --text-light: #00b8ff;
      --preformatted: #00ff9f;
      --border: #00ff9f;
      --disabled: #07271d;
      --sidenav-width: 220px;
      --content-width: 80rem;
      --sidebar-width: 300px;
      --gap: 4rem;
      --sans-font: -apple-system, BlinkMacSystemFont, "Avenir Next", Avenir,
        "Nimbus Sans L", Roboto, "Noto Sans", "Segoe UI", Arial, Helvetica,
        "Helvetica Neue", sans-serif;
      --mono-font: Consolas, Menlo, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
    }

    body {
      background-color: #111;
      color: #e0e0e0;
      font-family: 'Merriweather', serif;
    }

    h1 {
      color: #d600ff;
    }

    h2 {
      color: #00ff9f;
    }

    h3 {
      color: #001eff;
    }

    h4 {
      color: #00b8ff;
    }

    h5 {
      color: #ff8c00;
    }

    h6 {
      color: #bf00ff;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: #00ff9f;
    }

    a:hover {
      color: #00b8ff;
    }

    footer p,
    footer p a {
      color: #001eff;
    }

    .site-sidebar {
      background: rgba(10, 10, 10, 0.95);
    }

    .site-nav-title,
    .toc-title {
      color: var(--accent);
    }

    .site-nav-link:hover,
    .toc-link:hover {
      color: var(--accent);
    }

    .site-nav-submenu {
      border-left-color: var(--border);
    }

    .toc-sidebar {
      border-left-color: var(--border) !important;
      scrollbar-color: var(--border) transparent;
    }
  </style>
</head>

<body{{#site_navigation}} data-site-navigation="true"{{/site_navigation}}>
  <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation">
    <span></span>
    <span></span>
  </button>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div class="main-grid" id="main-grid">
    <aside class="site-sidebar" id="site-sidebar">
      <div class="site-nav-title" id="site-nav-title">Site</div>
      <nav id="site-nav"></nav>
    </aside>

    <main class="article">
      {{{content}}}
    </main>

    <aside class="toc-sidebar" id="toc-sidebar">
      <div class="toc-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="3" y2="18"></line>
        </svg>
        On this page
      </div>
      <nav id="toc-nav"></nav>
    </aside>
  </div>

  <footer>
    <p>Powered by <a href="https://www.npmjs.com/package/zenmd">ZenMD</a></p>
  </footer>

  <script src="{{{assetsBase}}}/main.js" defer></script>
</body>

</html>
