<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  {{#ogImage}}
  <meta property="og:image" content="{{{ogImage}}}">{{/ogImage}}
  {{#ogUrl}}
  <meta property="og:url" content="{{{ogUrl}}}">{{/ogUrl}}
  <link rel="icon" href="{{{favicon}}}">
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
  <link rel="stylesheet" href="{{{assetsBase}}}/main.css">
  <!-- Serif body font and sans headings -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* 
    To customize the default style, you should try to override the variables in SimpleCSS: 
    https://github.com/kevquirk/simple.css/wiki/Getting-Started-With-Simple.css#customise-simplecss
    Here are all the variables that's defined:
    */

    :root {
      /* Set sans-serif & mono fonts */
      --sans-font: -apple-system, BlinkMacSystemFont, "Avenir Next", Avenir,
        "Nimbus Sans L", Roboto, "Noto Sans", "Segoe UI", Arial, Helvetica,
        "Helvetica Neue", sans-serif;
      --mono-font: Consolas, Menlo, Monaco, "Andale Mono", "Ubuntu Mono", monospace;
      --standard-border-radius: 5px;
      --border-width: 1px;

      /* Default (light) theme */
      --bg: #fff;
      --accent-bg: #f5f7ff;
      --text: #212121;
      --text-light: #585858;
      --border: #898EA4;
      --accent: #0d47a1;
      --accent-hover: #1266e2;
      --accent-text: var(--bg);
      --code: #d81b60;
      --preformatted: #444;
      --marked: #ffdd33;
      --disabled: #efefef;
      --content-width: 80rem;
      --sidebar-width: 300px;
      --sidenav-width: 220px;
      --gap: 4rem;
    }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #212121;
        --accent-bg: #2b2b2b;
        --text: #dcdcdc;
        --text-light: #ababab;
        --accent: #ffb300;
        --accent-hover: #ffe099;
        --accent-text: var(--bg);
        --code: #f06292;
        --preformatted: #ccc;
        --disabled: #111;
      }
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
  <title>{{title}}</title>
</head>

<body{{#site_navigation}} data-site-navigation="true"{{/site_navigation}}>
  <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation">
    <span></span>
    <span></span>
  </button>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div class="main-grid" id="main-grid">
    <aside class="site-sidebar" id="site-sidebar">
      <div class="site-nav-title" id="site-nav-title">Site</div>
      <nav id="site-nav"></nav>
    </aside>

    <main class="article">
      {{{content}}}
    </main>

    <aside class="toc-sidebar" id="toc-sidebar">
      <div class="toc-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="3" y2="18"></line>
        </svg>
        On this page
      </div>
      <nav id="toc-nav"></nav>
    </aside>
  </div>

  <footer>
    <p>Powered by <a href="https://www.npmjs.com/package/zenmd">ZenMD</a></p>
  </footer>

  <script src="{{{assetsBase}}}/main.js" defer></script>
</body>

</html>
